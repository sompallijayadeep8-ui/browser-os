<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browser OS</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/desktop.css">
    <link rel="stylesheet" href="./css/taskbar.css">
    <link rel="stylesheet" href="./css/windows.css">
    <link rel="stylesheet" href="./css/apps.css">
</head>

<body>

    <div id="desktop">

        <!-- Desktop Area -->
        <main id="desktop-area">
            <!-- Desktop Icons will be rendered here -->
        </main>

        <!-- Workspace -->
        <section id="workspace">
            <!-- App windows will appear here -->
        </section>

        <!-- Notifications -->
        <aside id="notification-container">
            <!-- Notifications -->
        </aside>

        <!-- Start Menu -->
        <nav id="start-menu">
            <!-- Start Menu -->
        </nav>

        <!-- Taskbar -->
        <footer id="taskbar">

            <div id="taskbar-left">
                <!-- Start Button -->
            </div>

            <div id="taskbar-center">
                <!-- Running Apps -->
            </div>

            <div id="taskbar-right">
                <!-- Clock • WiFi • Battery -->
            </div>

        </footer>

    </div>

    <!-- JavaScript -->
    <script type="module" src="./js/main.js"></script>

</body>
</html>
