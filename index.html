<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browser OS</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div id="desktop">

        <!-- Desktop Area -->
        <main id="desktop-area">
            <!-- Desktop Icons will be rendered here -->
        </main>

        <!-- Workspace -->
        <section id="workspace">
            <!-- App windows will appear here -->
        </section>

        <!-- Notifications -->
        <aside id="notification-container">
            <!-- Notifications -->
        </aside>

        <!-- Start Menu -->
      <div id="start-menu" class="hidden">

    <h2>Applications</h2>

    <ul>

        <li>📝 Notes</li>

        <li>🧮 Calculator</li>

        <li>🌐 Browser</li>

        <li>⚙️ Settings</li>

    </ul>

   </div>

        <!-- Taskbar -->
        <footer id="taskbar">

            <div id="taskbar-left">
                <button id="start-btn">
                      ⊞ Start
                </button>
                <!-- Start Button -->
            </div>

            <div id="taskbar-center">
                <!-- Running Apps -->
            </div>

            <div id="taskbar-right">
                <span id="taskbar-clock"></span>
                <!-- Clock • WiFi • Battery -->
            </div>

        </footer>

    </div>

    <!-- JavaScript -->
    <script type="module" src="./js/main.js"></script>

</body>
</html>
